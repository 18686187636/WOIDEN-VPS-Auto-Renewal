name: Woiden Auto Renew

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 10 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils wget net-tools jq firefox ffmpeg curl
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruyiPage --upgrade
          python -m ruyipage install

      - name: Verify ruyipage
        run: python -c "import ruyipage; print(ruyipage.__version__)"

      - name: Configure sing-box proxy
        if: env.NODE_LINK != ''
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          # ...（此处省略，与之前相同，可复用之前的工作流片段）
          # 完整内容请参考之前的回复或标准模板

      - name: Print sing-box log
        if: always()
        run: cat sing-box.log || true

      - name: Run renewal
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          HEADLESS: "true"
          PROXY_SERVER: ${{ secrets.NODE_LINK != '' && 'http://127.0.0.1:1081' || '' }}
          SESSION_STRING_1: ${{ secrets.SESSION_STRING_1 }}
          SESSION_STRING_2: ${{ secrets.SESSION_STRING_2 }}
          SESSION_STRING_3: ${{ secrets.SESSION_STRING_3 }}
        run: |
          xvfb-run --auto-servernum python3 renew.py

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.log
            *.txt
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f firefox || true
          pkill -f geckodriver || true
          pkill -f Xvfb || true
